const parseCSV = (csvText) => {
  const lines = csvText.trim().split('\n');
  return lines.slice(1).map(line => {
    const cols = line.split(/[\t,]/);
    if (cols.length < 4) return null;
    return {
      id: cols[0]?.trim() || '-',
      customerType: cols[1]?.trim() || '-',
      area: cols[2]?.trim() || '-',
      team: cols[3]?.trim() || '-',
      cprName: cols[4]?.trim() || '-',
      cprPhone: cols[5]?.trim() || '',
      cmName: cols[6]?.trim() || '-',
      cmPhone: cols[7]?.trim() || '',
      pmName: cols[8]?.trim() || '-',
      pmPhone: cols[9]?.trim() || '',
    };
  }).filter(Boolean);
};

const initialData = parseCSV(rawCSV);

function App() {
  const [data] = useState(initialData);
  const [selectedArea, setSelectedArea] = useState('');
  const [selectedTeam, setSelectedTeam] = useState('');
  const [searchTerm, setSearchTerm] = useState('');
  const [copyStatus, setCopyStatus] = useState(null);

  const areas = useMemo(() => [...new Set(data.map(i => i.area))].sort(), [data]);

  const teamsList = useMemo(() => {
    if (!selectedArea) return [];
    return [...new Set(data.filter(i => i.area === selectedArea).map(i => i.team))].sort();
  }, [data, selectedArea]);

  useEffect(() => {
    setSelectedTeam('');
  }, [selectedArea]);

  const filteredData = useMemo(() => {
    return data.filter(item => {
      const matchArea = selectedArea ? item.area === selectedArea : true;
      const matchTeam = selectedTeam ? item.team === selectedTeam : true;
      const searchStr = `${item.cprName} ${item.cmName} ${item.pmName} ${item.cprPhone} ${item.cmPhone} ${item.pmPhone} ${item.team}`.toLowerCase();
      const matchSearch = searchTerm ? searchStr.includes(searchTerm.toLowerCase()) : true;
      return matchArea && matchTeam && matchSearch;
    });
  }, [data, selectedArea, selectedTeam, searchTerm]);

  const handleCall = (phone) => {
    if (!phone) return;
    const cleanPhone = phone.replace(/[^0-9+]/g, '');
    window.location.href = `tel:${cleanPhone}`;
  };

  const handleCopy = (phone) => {
    if (!phone) return;
    const cleanPhone = phone.replace(/[^0-9]/g, '');
    const tempInput = document.createElement('input');
    tempInput.value = cleanPhone;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand('copy');
    document.body.removeChild(tempInput);
    setCopyStatus(phone);
    setTimeout(() => setCopyStatus(null), 2000);
  };

  const ContactRow = ({ title, name, phone, colorClass, labelColor }) => (
    <div className={`p-4 ${colorClass} rounded-2xl flex items-center justify-between border border-slate-100 shadow-sm transition-all active:scale-[0.98]`}>
      <div className="flex-1">
        <div className="flex items-center gap-2 mb-1">
          <span className={`text-[10px] font-black px-2 py-0.5 rounded-full text-white uppercase ${labelColor}`}>
            {title}
          </span>
          <span className="text-xs font-bold text-slate-500">{name}</span>
        </div>
        <div className="flex items-center gap-2">
          <Phone size={14} className="text-slate-400" />
          <span className="text-lg font-mono font-black text-slate-800">{phone || '-'}</span>
        </div>
      </div>
      {phone && (
        <div className="flex gap-2">
          <button 
            onClick={() => handleCopy(phone)}
            className="p-3 bg-white rounded-xl shadow-sm border border-slate-100 text-slate-400 active:bg-slate-50"
            title="คัดลอกเบอร์"
          >
            {copyStatus === phone ? <Check size={20} className="text-green-500" /> : <Copy size={20} />}
          </button>
          <button 
            onClick={() => handleCall(phone)}
            className={`p-3 rounded-xl shadow-md text-white active:opacity-80 ${labelColor}`}
            title="โทรออก"
          >
            <Phone size={20} fill="currentColor" />
          </button>
        </div>
      )}
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-100 font-sans pb-20">
      <div className="bg-white px-4 pt-6 pb-4 sticky top-0 z-40 shadow-md">
        <div className="max-w-md mx-auto space-y-4">
          <div className="flex items-center gap-3">
            <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-200">
              <Phone className="text-white" size={24} />
            </div>
            <div>
              <h1 className="text-xl font-black text-slate-800 leading-tight">Phone Directory</h1>
              <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">การสื่อสารที่มีประสิทธิภาพ</p>
            </div>
          </div>

          <div className="relative">
            <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
            <input 
              type="text" 
              placeholder="ค้นหาชื่อ, ทีม หรือเบอร์โทร..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-10 pr-4 py-3 text-sm font-bold focus:ring-2 focus:ring-blue-100 outline-none transition-all"
            />
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div className="relative">
              <MapPin size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-blue-500" />
              <select 
                value={selectedArea}
                onChange={(e) => setSelectedArea(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-2 py-2 text-xs font-black appearance-none outline-none cursor-pointer"
              >
                <option value="">เลือก AREA</option>
                {areas.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
            <div className="relative">
              <Users size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-emerald-500" />
              <select 
                value={selectedTeam}
                onChange={(e) => setSelectedTeam(e.target.value)}
                disabled={!selectedArea}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-2 py-2 text-xs font-black appearance-none outline-none disabled:opacity-50 cursor-pointer"
              >
                <option value="">เลือก TEAM</option>
                {teamsList.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          </div>

          {(searchTerm || selectedArea) && (
            <button 
              onClick={() => {setSearchTerm(''); setSelectedArea(''); setSelectedTeam('');}}
              className="w-full text-[10px] font-black text-red-500 flex items-center justify-center gap-1 uppercase py-1"
            >
              <RefreshCcw size={12} /> ล้างการค้นหา
            </button>
          )}
        </div>
      </div>

      <div className="max-w-md mx-auto p-4 space-y-6 mt-2">
        {filteredData.length > 0 ? (
          filteredData.map(item => (
            <div key={item.id} className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
              <div className="bg-slate-800 px-6 py-3 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="bg-white/20 px-2 py-0.5 rounded text-[10px] font-black text-white">#{item.id}</div>
                  <h2 className="text-white font-black">AREA: {item.area} / TEAM: {item.team}</h2>
                </div>
                <div className="text-[10px] font-bold text-slate-400 uppercase">{item.customerType}</div>
              </div>

              <div className="p-4 space-y-3">
                <ContactRow 
                  title="ฝ่าย CPR" 
                  name={item.cprName} 
                  phone={item.cprPhone} 
                  colorClass="bg-blue-50"
                  labelColor="bg-blue-600"
                />
                <ContactRow 
                  title="งานซ่อม CM" 
                  name={item.cmName} 
                  phone={item.cmPhone} 
                  colorClass="bg-orange-50"
                  labelColor="bg-orange-500"
                />
                <ContactRow 
                  title="งานบำรุง PM" 
                  name={item.pmName} 
                  phone={item.pmPhone} 
                  colorClass="bg-emerald-50"
                  labelColor="bg-emerald-500"
                />
              </div>
            </div>
          ))
        ) : (
          <div className="py-20 text-center">
            <div className="bg-slate-200 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
              <Search className="text-slate-400" size={32} />
            </div>
            <p className="text-slate-400 font-black">ไม่พบข้อมูลที่คุณค้นหา</p>
          </div>
        )}
      </div>

      <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-max px-6 py-2 bg-slate-900/90 backdrop-blur rounded-full shadow-2xl z-50">
        <p className="text-white text-[10px] font-black uppercase tracking-widest">
          แสดงข้อมูล {filteredData.length} รายการ
        </p>
      </div>

      {copyStatus && (
        <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-green-500 text-white px-4 py-2 rounded-full text-xs font-black shadow-xl z-50 animate-bounce">
          คัดลอกเบอร์สำเร็จ!
        </div>
      )}
    </div>
  );
}
</script><script type="text/babel">ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
